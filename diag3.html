<!doctype html><html><head><meta charset="utf-8"><title>diag3</title>
<style>body{font:12px/1.4 monospace;background:#0f1115;color:#ddd;padding:10px;white-space:pre-wrap;word-break:break-all}</style>
</head><body><div id="o"></div>
<script>
var O=document.getElementById('o');
function w(t,c){var d=document.createElement('div');if(c)d.style.color=c;d.textContent=String(t);O.appendChild(d);}
function get(u){return fetch(u+'?x='+Date.now()).then(function(r){return r.text()});}
function range(L,a,b,tag){w('--- '+tag+' ---','#9be29b');for(var i=a;i<=b&&i<=L.length;i++)w(i+'| '+L[i-1]);}
(async function(){
 var S=(await get('https://raw.githubusercontent.com/fahshomi-ui/KDD/main/server/index.js')).split('\n');
 var A=(await get('https://raw.githubusercontent.com/fahshomi-ui/KDD/main/server/admin/index.html')).split('\n');
 range(S,344,455,'A) KDD visitor:register');
 range(S,1690,1795,'B) KDD bridge + sweep');
 for(var i=0;i<A.length;i++){ if(/script id="kddF93"/.test(A[i])){ range(A,i+66,i+115,'C) KDD F93 delete handler'); break; } }
 w('== DONE ==','#9be29b');
})();
</script></body></html>
