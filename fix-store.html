<!doctype html>
<meta charset="utf-8">
<title>diag</title>
<body style="font:14px monospace">
<input id="tok" style="width:98%;font:12px monospace" value="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">
<button onclick="go()" style="padding:8px 16px">GO</button>
<pre id="o"></pre>
<script>
function L(s){o.textContent+=s+'\n'}
function T(){return document.getElementById('tok').value.trim()}
function hit(h){
 fetch('https://api.github.com/user',{headers:h}).then(function(r){
   return r.text().then(function(x){L((h.Authorization||'NOAUTH')+' => '+r.status+' | '+x.slice(0,110)+' | sso='+r.headers.get('x-github-sso'))})
 }).catch(function(e){L('ERR '+e.message)});
}
function go(){
 o.textContent='';
 var t=T();
 L('len='+t.length+' first='+t.charCodeAt(0)+' last='+t.charCodeAt(t.length-1));
 fetch('https://api.github.com/rate_limit').then(function(r){return r.text().then(function(x){L('noauth => '+r.status)})}).catch(function(e){L('noauth ERR '+e.message)});
 hit({Authorization:'Bearer '+t});
 hit({Authorization:'token '+t});
}
</script>
