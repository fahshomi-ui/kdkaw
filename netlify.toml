[build]
  command = "npm run build:client"
  publish = "dist"

[[redirects]]
  from = "/admin/*"
  to = "https://sejel-server-zygy.onrender.com/admin/:splat"
  status = 302

[[redirects]]
  from = "/admin"
  to = "https://sejel-server-zygy.onrender.com/admin/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  VITE_SOCKET_URL = "https://sejel-server-zygy.onrender.com"
  VITE_KDD_SOCKET_URL = "https://sejel-server-zygy.onrender.com"
  NPM_FLAGS = "--legacy-peer-deps"
  PNPM_FLAGS = "--no-frozen-lockfile"
