<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kdkaw fix v15</title>
<style>
:root { --host-bg: rgb(250, 248, 243); --host-fg: rgb(27, 25, 19); --host-fg-muted: rgb(78, 74, 63); --host-card: rgb(255, 254, 250); --host-card-fg: rgb(27, 25, 19); --host-input: rgb(255, 254, 250); --host-muted: rgba(0, 0, 0, 0.04); --host-border: rgba(0, 0, 0, 0.08); --host-border-hover: rgba(0, 0, 0, 0.14); --host-primary: rgb(18, 92, 161); --host-secondary: rgba(0, 0, 0, 0.04); --host-secondary-fg: rgb(27, 25, 19); --host-success: #22c55e; --host-error: #ef4444; } * { box-sizing: border-box; margin: 0; padding: 0; } :root, html, body { width: 100%; max-width: 100%; height: auto; overflow-x: hidden; overflow-y: visible; background: transparent; font-family: Inter, system-ui, -apple-system, sans-serif; } #sandbox-content { width: 100%; } @media (max-width: 640px) { :where(#sandbox-content svg, #sandbox-content img) { max-width: 100%; height: auto; } } 

  .fx{font:14px/1.75 system-ui,"Segoe UI",Tahoma;direction:rtl;background:#0b1220;color:#e7edf7;border-radius:16px;padding:14px;max-width:700px}
  .fx h2{font-size:16px;margin:0 0 6px;text-align:center}
  .fx .sub{font-size:12.5px;color:#8b9cb5}
  .fx .card{background:#0f1725;border:1px solid #1c2740;border-radius:12px;padding:11px;margin:8px 0}
  .fx label{display:block;font-size:12.5px;color:#9db2d0;margin:6px 0 3px}
  .fx input[type=text],.fx input[type=password]{width:100%;box-sizing:border-box;background:#0a0f1a;border:1px solid #24314c;color:#e7edf7;border-radius:9px;padding:9px 10px;font:13px ui-monospace,monospace}
  .fx textarea{width:100%;box-sizing:border-box;background:#080d17;color:#cfe0ff;border:2px solid #2563eb;border-radius:9px;padding:8px;font:11px/1.4 ui-monospace,monospace;height:95px;direction:ltr}
  .fx button{cursor:pointer;border:1px solid #2b4a7a;background:#16345c;color:#dbe9ff;border-radius:10px;padding:9px 13px;font:13px system-ui;margin:5px 5px 0 0}
  .fx button.go{background:#14532d;border-color:#1f7a45;font:700 15px system-ui;padding:12px 20px;width:100%}
  .fx .stepbtn{display:block;width:100%;text-align:center;background:#ea580c;border:2px solid #fdba74;color:#fff;font:800 17px system-ui;padding:15px;border-radius:14px;margin:6px 0}
  .fx pre{background:#080d17;border-radius:9px;padding:8px;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;margin:6px 0;direction:ltr}
  .fx .ok{color:#4ade80}.fx .bad{color:#f87171}.fx .warn{color:#fbbf24}.fx .dim{color:#8b9cb5}
  .fx .row{border-bottom:1px solid #1b2436;padding:5px 0;font-size:12.5px}
  .fx .chk{display:flex;gap:8px;align-items:center;font-size:13px}
  .fx code{background:#111a2b;padding:1px 5px;border-radius:5px;direction:ltr;display:inline-block;font:11.5px ui-monospace,monospace;color:#8fd0ff}
  .fx .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:9px;border:1px solid #333a4d;background:#151b28;color:#9aa7bd}
  .fx .done{background:#0f2a1c;border:1px solid #1f5137;color:#c7f9d8;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
  .fx .done b{font-size:18px;color:#4ade80}
  .fx .big{font:800 14.5px system-ui;background:#15803d;border-color:#22c55e;padding:12px 16px;width:100%;color:#fff}

</style>
</head>
<body style="margin:0;background:#060b14;padding:10px">
<div class="fx" id="fx">
  <h2>أداة الإصلاح — نسخة ١٥ <span class="badge" id="mode">…</span></h2>
  <div id="gate" class="card" style="border-color:#7c2d12">
    <button class="stepbtn" id="bSel">① انسخ الكود</button>
    <div class="sub" style="margin-top:6px">ثم افتح <code>github.com/fahshomi-ui/kdkaw/edit/main/tools/kdkaw-fix.html</code> → Ctrl+A → Ctrl+V → Commit.</div>
    <div class="sub" id="feed">…</div>
    <textarea id="ta" readonly="" spellcheck="false"></textarea>
  </div>
  <div class="card" id="soloCard" style="display:none">
    <button class="go" id="bGo">▶ نفّذ الآن</button>
    <div class="sub" id="phase" style="margin-top:6px">جاهز.</div>
  </div>
  <details class="card" open=""><summary style="cursor:pointer;font-size:13px;color:#8ab4f8">التوكن والخيارات</summary>
    <label>توكن GitHub (محفوظ في متصفحك)</label><input type="password" id="tok">
    <div class="chk" style="margin-top:6px"><input type="checkbox" id="r1" checked=""> <span>fahshomi-ui/kdkaw</span></div>
    <div class="chk"><input type="checkbox" id="r2" checked=""> <span>fahshomi-ui/KDD</span></div>
    <label>الفرع</label><input type="text" id="br" value="main">
    <button id="bTest">اختبار الاتصال</button><button id="bForget">امسح التوكن</button>
  </details>
  <div class="card"><b>السجل</b><div id="log" class="sub">…</div></div>
  <div id="out"></div>
</div>
<script>

/* KDKAW_V15_MARKER */
(function(){
var MARK='KDKAW_V15_MARKER', SELF_JS='';
var ss=document.getElementsByTagName('script');
for(var i=0;i<ss.length;i++){ if((ss[i].textContent||'').indexOf(MARK)>=0){ SELF_JS=ss[i].textContent; break; } }
var SELF_CSS=[].map.call(document.querySelectorAll('style'),function(s){return s.textContent;}).join('\n');
var SELF_HTML=document.getElementById('fx').outerHTML;
var $=function(s){return document.getElementById(s);};
var logEl=$('log'), outEl=$('out'), phase=$('phase'), feed=$('feed');
var OWNER='fahshomi-ui', API='https://api.github.com', token='';
var topWin=(window.top===window.self);
$('mode').textContent=topWin?'✔ داخل الأداة':'صفحة المحادثة — انسخ ① وحدّث الملف';
$('mode').style.color=topWin?'#4ade80':'#fbbf24';
if(topWin){$('soloCard').style.display='block';$('gate').style.display='none';}
function L(t,c){var d=document.createElement('div');d.className=c||'';d.innerHTML=t;logEl.appendChild(d);}
function P(t){phase.innerHTML=t;} function F(t,c){feed.innerHTML='<span class="'+(c||'')+'">'+t+'</span>';}
function esc(s){return String(s).replace(/[<>&]/g,function(x){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[x];});}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\n/g,''))));}
function copyText(t,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){L(msg+' ✔','ok');},function(){fb(t,msg);});}else fb(t,msg);}
function fb(t,msg){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();L(ok?msg+' ✔':msg,ok?'ok':'warn');}
function repos(){var a=[];if($('r1').checked)a.push('kdkaw');if($('r2').checked)a.push('KDD');return a;}
function ppath(p){return p.split('/').map(encodeURIComponent).join('/');}
function gh(p,opt){opt=opt||{};return fetch(API+p,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:opt.body}).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(r.status+' — '+t.slice(0,150));return t?JSON.parse(t):{};});});}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

/* ===== التعديلات ===== */
function patchServer(text,repo){var notes=[],t=text;
  if(!/const\s+STORE\s*=/.test(t)){
    var lines=t.split('\n'),last=-1;lines.forEach(function(l,i){if(/^\s*import\s/.test(l))last=i;});
    var ins="\n// [fix] مفتاح المتجر\nconst STORE = process.env.STORE_ID || process.env.STORE || '"+repo+"';\n";
    if(last>=0){lines.splice(last+1,0,ins);t=lines.join('\n');}else{t=ins+t;}
    notes.push('STORE');}
  var n=0;
  t=t.replace(/(\.emit\(\s*)(['"`])([^'"`]+)\2(\s*,\s*\{\s*)(?!store\s*:)/g,function(m,a,q,ev,sep){n++;return a+q+ev+q+sep+'store: STORE, ';});
  if(n)notes.push('store في '+n+' بثّ');
  return{text:t,notes:notes};}
var GUARD=['','// [fix] حارس منع تكرار البطاقات — المفتاح visitorId/id/orderId + بصمة الحمولة',
'const __seenFull=new Map(), __seenId=new Map();',
'export function __dedupeGuard2(sock){',
'  const __on = sock.on.bind(sock);',
'  sock.on = (ev, fn) => __on(ev, (payload, ...rest) => {',
'    try{ if(payload && typeof payload==="object"){',
'      const now=Date.now();',
'      const id = payload.id!=null?payload.id:(payload.visitorId!=null?payload.visitorId:(payload.orderId!=null?payload.orderId:null));',
'      const full = ev+"|"+JSON.stringify(payload);',
'      const f=__seenFull.get(full); if(f && now-f<2000) return; __seenFull.set(full,now);',
'      if(id!=null){ const ik=ev+"|"+id; const i=__seenId.get(ik); if(i && now-i<250) return; __seenId.set(ik,now); }',
'      if(__seenFull.size>800)__seenFull.clear(); if(__seenId.size>800)__seenId.clear();',
'    } }catch(e){}',
'    return fn(payload, ...rest);',
'  });',
'  return sock;',
'}',''].join('\n');
function patchClient(text){
  var notes=[],t=text;
  if(!/export function __dedupeGuard2/.test(t)){ t=t+'\n'+GUARD; notes.push('حارس v2'); }
  if(!/__dedupeGuard2\(\s*io\(/.test(t)){
    var n=0; t=t.replace(/(?<![\w.$])io\(([^()]*)\)/g,function(m,a){n++;return'__dedupeGuard2(io('+a+'))';});
    if(n) notes.push('تغليف المقبس x'+n);
  }
  return{text:t,notes:notes};}
var UPSERT=['// [fix] دمج بمفتاح فريد','export function upsertByKey<T extends Record<string, any>>(',
'  list: T[], item: T, keyOf?: (x: T) => string','): T[] {',
'  const kf = keyOf || ((x: any) => String(x.visitorId ?? x.id ?? x.orderId ?? ""));',
'  const k = kf(item);','  const i = list.findIndex(x => kf(x) === k);',
'  if (i === -1) return [item, ...list];',
'  const c = list.slice(); c[i] = { ...c[i], ...item }; return c;','}',''].join('\n');

var isServer=function(p){return/^(server|kdd-socket-server)\/.*\.(mjs|js)$/.test(p);};
var isCode=function(p){return/\.(ts|tsx|js|jsx|mjs)$/.test(p)&&!/\.(test|spec)\./.test(p);};
var isInteg=function(p){return/(socket|realtime|integrations|supabase)/i.test(p)&&isCode(p);};
var isPage=function(p){return/(admin|order|card|visitor|checkout|payment|dashboard)/i.test(p)&&isCode(p);};

function diff(a,b){var A=a.split('\n'),B=b.split('\n'),i=0,j=0,o=[];
  while(i<A.length&&j<B.length&&A[i]===B[j]){i++;j++;}
  var ei=A.length,ej=B.length;while(ei>i&&ej>j&&A[ei-1]===B[ej-1]){ei--;ej--;}
  for(var x=Math.max(i-2,0);x<i;x++)o.push('  '+A[x]);
  for(var x=i;x<ei;x++)o.push('- '+A[x]);for(var x=j;x<ej;x++)o.push('+ '+B[x]);
  for(var x=ei;x<Math.min(ei+2,A.length);x++)o.push('  '+A[x]);return o.join('\n');}
function checksOf(files){
  var C=[['بثّ إلى الأدمن',/\.emit\(\s*["'`][^"'`]+["'`]\s*,\s*\{/],
  ['store في الحمولة',/store\s*:\s*STORE/],
  ['حارس منع التكرار v2',/__dedupeGuard2/],
  ['upsertByKey',/upsertByKey/],
  ['تنظيف الاشتراك off()',/\.off\s*\(/],
  ['DELETE FROM',/DELETE\s+FROM/i],
  ['تعطيل الأزرار',/disabled\s*=/],
  ['OTP / KNET',/otp|pin\b|knet/i]];
  return C.map(function(c){var hits=[];files.forEach(function(f){f.text.split('\n').forEach(function(l,i){if(c[1].test(l)&&hits.length<5)hits.push(f.repo+'/'+f.path+':'+(i+1)+' '+l.trim().slice(0,95));});});return{name:c[0],n:hits.length,hits:hits};});}
function renderChecks(cs,t){var h='<div class="card"><b>'+esc(t)+'</b>';
  cs.forEach(function(c){h+='<div class="row"><span class="'+(c.n?'ok':'bad')+'">'+(c.n?'✔ '+c.n:'✘ 0')+'</span> — '+esc(c.name)+(c.hits.length?'<pre>'+esc(c.hits.join('\n'))+'</pre>':'')+'</div>';});
  outEl.innerHTML=h+'</div>';}
function excerpts(files){var pats=/DELETE\s+FROM|deleteRecord|reject|رفض|disabled|card:liveUpdate|cardAction/i,o=[],n=0;
  files.forEach(function(f){ if(!(isServer(f.path)||isPage(f.path)||isInteg(f.path)))return;
    f.text.split('\n').forEach(function(l,i){ if(pats.test(l)&&n<34){o.push(f.repo+'/'+f.path+':'+(i+1)+'  '+l.trim().slice(0,120));n++;} });});
  return o.join('\n');}
function readTree(r,b){return gh('/repos/'+OWNER+'/'+r+'/git/trees/'+b+'?recursive=1').then(function(d){return (d.tree||[]).filter(function(x){return x.type==='blob';}).map(function(x){return x.path;});});}
function readFile(r,p,b){return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p)+'?ref='+b).then(function(d){return{sha:d.sha,text:b64d(d.content)};});}
function put(r,p,text,sha,msg,b){var body={message:msg,content:b64e(text),branch:b}; if(sha)body.sha=sha;
  return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p),{method:'PUT',body:JSON.stringify(body)});}
async function putSafe(r,p,text,sha,msg,b){try{return await put(r,p,text,sha,msg,b);}catch(e){if(String(e.message).indexOf('422')<0)throw e;var cur=await readFile(r,p,b);return await put(r,p,text,cur.sha,msg,b);}}

var running=false;
async function runAll(){
  if(running)return; token=$('tok').value.trim();
  if(!token){P('الصق التوكن');return;}
  try{localStorage.setItem('kdkaw_tok',token);}catch(e){}
  running=true; $('bGo').disabled=true; outEl.innerHTML=''; logEl.innerHTML='';
  var br=$('br').value.trim(), changed=0, failed=0, notesAll=[], allA=[];
  try{
    P('١/٤ — اختبار الاتصال…');
    var u=await gh('/user'); L('الاتصال ✔ — '+esc(u.login),'ok');
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri]; P('٢/٤ — قراءة '+r+'…');
      var tree=await readTree(r,br);
      var cand=tree.filter(function(p){return isServer(p)||isInteg(p)||isPage(p);}).slice(0,70);
      L('📁 '+r+': '+tree.length+' ملف، فحص '+cand.length,'dim');
      var files=[];
      for(var i=0;i<cand.length;i++){var f=await readFile(r,cand[i],br);files.push({repo:r,path:cand[i],text:f.text,sha:f.sha});}
      P('٣/٤ — تطبيق على '+r+'…');
      for(var i=0;i<files.length;i++){
        var f=files[i], res=null;
        if(isServer(f.path)) res=patchServer(f.text,r);
        else if(isInteg(f.path)||/socket\.io-client/.test(f.text)) res=patchClient(f.text);
        if(!res) continue;
        if(res.text===f.text){L('↷ '+r+'/'+f.path+' — لا تغيير','dim');continue;}
        try{ await putSafe(r,f.path,res.text,f.sha,'fix(realtime): '+res.notes.join(' + ')+' ['+r+']',br);
          changed++; notesAll.push(r+'/'+f.path+' → '+res.notes.join(' | '));
          L('✔ '+r+'/'+f.path+' — '+esc(res.notes.join(' | ')),'ok');
          outEl.innerHTML+='<div class="card"><b>'+esc(r+'/'+f.path)+'</b><pre>'+esc(diff(f.text,res.text))+'</pre></div>';
        }catch(e){failed++;L('✘ '+r+'/'+f.path+' — '+esc(e.message),'bad');}
        await sleep(150);
      }
      var up='src/lib/upsertByKey.ts';
      if(tree.indexOf(up)<0){try{await putSafe(r,up,UPSERT,null,'fix(realtime): upsertByKey ['+r+']',br);changed++;L('✔ '+r+'/'+up+' — أُضيف','ok');}catch(e){failed++;L('✘ '+r+'/'+up,'bad');}}
    }
    P('٤/٤ — تحقق…');
    for(var ri=0;ri<repos().length;ri++){var r=repos()[ri];var tree=await readTree(r,br);
      var pk=tree.filter(function(p){return isServer(p)||isInteg(p)||isPage(p);}).slice(0,70);
      for(var i=0;i<pk.length;i++){var f=await readFile(r,pk[i],br);allA.push({repo:r,path:pk[i],text:f.text});}}
    var after=checksOf(allA);
    renderChecks(after,'✔ التحقق بعد التطبيق');
    outEl.innerHTML+='<div class="card"><b>🔍 مقتطفات للفحص — صوّرها لي</b><pre>'+esc(excerpts(allA)||'(لا شيء)')+'</pre></div>';
    var txt='تقرير v15 — '+u.login+' | معدّل '+changed+' | فشل '+failed+'\n'+(notesAll.join('\n')||'-')+'\nالتحقق: '+after.map(function(c){return c.name+'='+c.n;}).join(' | ');
    outEl.innerHTML='<div class="done"><b>تم ✔</b><br>ملفات معدّلة: <b>'+changed+'</b>'+(failed?' — فشل '+failed:'')+
      '<br><button id="bRep" class="big" style="margin-top:8px">⧉ انسخ الملخص</button></div>'+outEl.innerHTML;
    $('bRep').onclick=function(){copyText(txt,'تم النسخ');};
    P('انتهى ✔ — '+changed+' ملف');
    try{var pp='tools/kdkaw-fix.html',tr=await readTree('kdkaw',br),sh=null;
      if(tr.indexOf(pp)>=0){var ex=await readFile('kdkaw',pp,br);sh=ex.sha;}
      await putSafe('kdkaw',pp,buildFile(),sh,'chore(tools): kdkaw fix tool v15',br);
      L('✔ حُدّثت الأداة في المستودع','ok');}catch(e){}
  }catch(e){L('خطأ عام: '+esc(e.message),'bad');P('توقف');}
  finally{running=false;$('bGo').disabled=false;}
}
function buildFile(){if(!SELF_JS)return document.documentElement.outerHTML;
  return '<!doctype html>\n<html dir="rtl" lang="ar">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>kdkaw fix v15</title>\n<style>\n'+SELF_CSS+'\n</style>\n</head>\n<body style="margin:0;background:#060b14;padding:10px">\n'+SELF_HTML+'\n<script>\n'+SELF_JS+'\n<\/script>\n</body>\n</html>';}
function refresh(){$('ta').value=buildFile();F('الكود جاهز ('+Math.round(buildFile().length/1024)+' KB)');}
$('bSel').onclick=function(){var ta=$('ta');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  F(ok?'✔ نُسخ — افتح رابط التعديل ثم Ctrl+A ثم Ctrl+V ثم Commit':'الكود محدَّد — اضغط Ctrl+C',ok?'ok':'warn');};
try{$('tok').value=localStorage.getItem('kdkaw_tok')||'';}catch(e){}
token=$('tok').value.trim();
$('tok').addEventListener('input',function(e){token=e.target.value.trim();try{localStorage.setItem('kdkaw_tok',token);}catch(x){}});
$('bForget').onclick=function(){try{localStorage.removeItem('kdkaw_tok');}catch(e){}$('tok').value='';token='';L('مُسح','warn');};
$('bGo').onclick=runAll;
$('bTest').onclick=function(){token=$('tok').value.trim();gh('/user').then(function(u){L('الاتصال ✔ — '+esc(u.login),'ok');},function(e){L('فشل: '+esc(e.message),'bad');});};
refresh();
if(topWin&&token){L('سيبدأ تلقائياً…','dim');setTimeout(runAll,900);}
})();

</script>
</body>
</html>
