<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>kdkaw fix v18</title>
<style>

:root { --host-bg: rgb(250, 248, 243); --host-fg: rgb(27, 25, 19); --host-fg-muted: rgb(78, 74, 63); --host-card: rgb(255, 254, 250); --host-card-fg: rgb(27, 25, 19); --host-input: rgb(255, 254, 250); --host-muted: rgba(0, 0, 0, 0.04); --host-border: rgba(0, 0, 0, 0.08); --host-border-hover: rgba(0, 0, 0, 0.14); --host-primary: rgb(18, 92, 161); --host-secondary: rgba(0, 0, 0, 0.04); --host-secondary-fg: rgb(27, 25, 19); --host-success: #22c55e; --host-error: #ef4444; } * { box-sizing: border-box; margin: 0; padding: 0; } :root, html, body { width: 100%; max-width: 100%; height: auto; overflow-x: hidden; overflow-y: visible; background: transparent; font-family: Inter, system-ui, -apple-system, sans-serif; } #sandbox-content { width: 100%; } @media (max-width: 640px) { :where(#sandbox-content svg, #sandbox-content img) { max-width: 100%; height: auto; } } 

  .fx{font:14px/1.75 system-ui,"Segoe UI",Tahoma;direction:rtl;background:#0b1220;color:#e7edf7;border-radius:16px;padding:14px;max-width:700px}
  .fx h2{font-size:16px;margin:0 0 6px;text-align:center}
  .fx .sub{font-size:12.5px;color:#8b9cb5}
  .fx .card{background:#0f1725;border:1px solid #1c2740;border-radius:12px;padding:11px;margin:8px 0}
  .fx label{display:block;font-size:12.5px;color:#9db2d0;margin:6px 0 3px}
  .fx input[type=text],.fx input[type=password]{width:100%;box-sizing:border-box;background:#0a0f1a;border:1px solid #24314c;color:#e7edf7;border-radius:9px;padding:9px 10px;font:13px ui-monospace,monospace}
  .fx textarea{width:100%;box-sizing:border-box;background:#080d17;color:#cfe0ff;border:2px solid #2563eb;border-radius:9px;padding:8px;font:11px/1.4 ui-monospace,monospace;height:80px;direction:ltr}
  .fx button{cursor:pointer;border:1px solid #2b4a7a;background:#16345c;color:#dbe9ff;border-radius:10px;padding:9px 13px;font:13px system-ui;margin:5px 5px 0 0}
  .fx button.go{background:#14532d;border-color:#1f7a45;font:700 15px system-ui;padding:12px 20px;width:100%}
  .fx button.an{background:#4c1d95;border-color:#a78bfa;font:700 14px system-ui;padding:11px 16px;width:100%}
  .fx .stepbtn{display:block;width:100%;text-align:center;background:#ea580c;border:2px solid #fdba74;color:#fff;font:800 17px system-ui;padding:15px;border-radius:14px;margin:6px 0}
  .fx pre{background:#080d17;border-radius:9px;padding:8px;font:10.5px/1.45 ui-monospace,monospace;white-space:pre;overflow:auto;max-height:400px;margin:6px 0;direction:ltr;text-align:left}
  .fx .ok{color:#4ade80}.fx .bad{color:#f87171}.fx .warn{color:#fbbf24}.fx .dim{color:#8b9cb5}
  .fx .row{border-bottom:1px solid #1b2436;padding:5px 0;font-size:12.5px}
  .fx .chk{display:flex;gap:8px;align-items:center;font-size:13px}
  .fx code{background:#111a2b;padding:1px 5px;border-radius:5px;direction:ltr;display:inline-block;font:11.5px ui-monospace,monospace;color:#8fd0ff}
  .fx .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:9px;border:1px solid #333a4d;background:#151b28;color:#9aa7bd}
  .fx .done{background:#0f2a1c;border:1px solid #1f5137;color:#c7f9d8;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
  .fx .done b{font-size:18px;color:#4ade80}


</style>
</head>
<body style="margin:0;background:#060b14;padding:10px">
<div class="fx" id="fx">
  <h2>أداة الإصلاح — نسخة ١٨ (إصلاح تكرار store) <span class="badge" id="mode">…</span></h2>
  <div id="gate" class="card" style="border-color:#7c2d12">
    <button class="stepbtn" id="bSel">① انسخ الكود</button>
    <div class="sub" style="margin-top:6px">ثم <code>github.com/fahshomi-ui/kdkaw/edit/main/tools/kdkaw-fix.html</code> → Ctrl+A → Ctrl+V → Commit.</div>
    <div class="sub" id="feed">…</div>
    <textarea id="ta" readonly="" spellcheck="false"></textarea>
  </div>
  <div class="card" id="soloCard" style="display:none">
    <button class="go" id="bGo">▶ إصلاح تكرار store + تأمين STORE</button>
    <button class="an" id="bAn" style="margin-top:8px">🔍 فحص سريع: هل STORE معرّف؟</button>
    <div class="sub" id="phase" style="margin-top:6px">جاهز.</div>
  </div>
  <details class="card" open=""><summary style="cursor:pointer;font-size:13px;color:#8ab4f8">التوكن والخيارات</summary>
    <label>توكن GitHub (محفوظ)</label><input type="password" id="tok">
    <div class="chk" style="margin-top:6px"><input type="checkbox" id="r1" checked=""> <span>fahshomi-ui/kdkaw</span></div>
    <div class="chk"><input type="checkbox" id="r2" checked=""> <span>fahshomi-ui/KDD</span></div>
    <label>الفرع</label><input type="text" id="br" value="main">
    <button id="bTest">اختبار الاتصال</button>
  </details>
  <div class="card"><b>السجل</b><div id="log" class="sub">…</div></div>
  <div id="out"></div>
</div>
<script>


/* KDKAW_V18_MARKER */
(function(){
var MARK='KDKAW_V18_MARKER', SELF_JS='';
var ss=document.getElementsByTagName('script');
for(var i=0;i<ss.length;i++){ if((ss[i].textContent||'').indexOf(MARK)>=0){ SELF_JS=ss[i].textContent; break; } }
var SELF_CSS=[].map.call(document.querySelectorAll('style'),function(s){return s.textContent;}).join('\n');
var SELF_HTML=document.getElementById('fx').outerHTML;
var $=function(s){return document.getElementById(s);};
var logEl=$('log'), outEl=$('out'), phase=$('phase'), feed=$('feed');
var OWNER='fahshomi-ui', API='https://api.github.com', token='';
var topWin=(window.top===window.self);
$('mode').textContent=topWin?'✔ داخل الأداة':'صفحة المحادثة — انسخ ① وحدّث الملف';
$('mode').style.color=topWin?'#4ade80':'#fbbf24';
if(topWin){$('soloCard').style.display='block';$('gate').style.display='none';}
function L(t,c){var d=document.createElement('div');d.className=c||'';d.innerHTML=t;logEl.appendChild(d);}
function P(t){phase.innerHTML=t;} function F(t,c){feed.innerHTML='<span class="'+(c||'')+'">'+t+'</span>';}
function esc(s){return String(s).replace(/[<>&]/g,function(x){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[x];});}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\n/g,''))));}
function repos(){var a=[];if($('r1').checked)a.push('kdkaw');if($('r2').checked)a.push('KDD');return a;}
function ppath(p){return p.split('/').map(encodeURIComponent).join('/');}
function gh(p,opt){opt=opt||{};return fetch(API+p,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:opt.body}).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(r.status+' — '+t.slice(0,150));return t?JSON.parse(t):{};});});}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

/* ===== إصلاح وترميم ===== */
function addStoreConst(t,repo){
  var ins="// [fix] مفتاح المتجر\nconst STORE = process.env.STORE_ID || process.env.STORE || '"+repo+"';\n";
  var lines=t.split('\n');
  if(/^#!/.test(lines[0])){ lines.splice(1,0,ins); return lines.join('\n'); }
  var last=-1; lines.forEach(function(l,i){if(/^\s*import\s/.test(l))last=i;});
  if(last>=0){ lines.splice(last+1,0,'\n'+ins); return lines.join('\n'); }
  return ins+'\n'+t;
}
function patchServer(text,repo){
  var notes=[], t=text, before;
  /* 1) إزالة تكرار store: STORE */
  before=t;
  t=t.replace(/(store\s*:\s*STORE\s*,\s*){2,}/g,'store: STORE, ');
  t=t.replace(/,\s*store\s*:\s*STORE\s*(?=\s*\}\s*\))/g,'');
  t=t.replace(/\{\s*store\s*:\s*STORE\s*,\s*\}\s*\)/g,'})');
  if(t!==before) notes.push('إزالة تكرار store');
  /* 2) إضافة store للبثّ الناقص */
  var n=0;
  t=t.replace(/(\.emit\(\s*)(['"`])([^'"`]+)\2(\s*,\s*\{\s*)(?!store\s*:)/g,function(m,a,q,ev,sep){n++;return a+q+ev+q+sep+'store: STORE, ';});
  if(n) notes.push('store في '+n+' بثّ');
  /* 3) تأمين تعريف STORE */
  if(/store\s*:\s*STORE/.test(t) && !/^\s*(const|let|var)\s+STORE\s*=/m.test(t)){ t=addStoreConst(t,repo); notes.push('أُضيف تعريف STORE'); }
  /* 4) إزالة تعريف STORE المكرر */
  var m=t.match(/^\s*const\s+STORE\s*=/gm);
  if(m&&m.length>1){ var seen=0; t=t.replace(/^\s*const\s+STORE[^\n]*\n/gm,function(x){seen++;return seen>1?'':x;}); notes.push('أُزيل تعريف STORE مكرر'); }
  return {text:t,notes:notes};
}
var isServer=function(p){return/^(server|kdd-socket-server)\/.*\.(mjs|js)$/.test(p);};
function readTree(r,b){return gh('/repos/'+OWNER+'/'+r+'/git/trees/'+b+'?recursive=1').then(function(d){return (d.tree||[]).filter(function(x){return x.type==='blob';}).map(function(x){return x.path;});});}
function readFile(r,p,b){return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p)+'?ref='+b).then(function(d){return{sha:d.sha,text:b64d(d.content)};});}
function put(r,p,text,sha,msg,b){var body={message:msg,content:b64e(text),branch:b}; if(sha)body.sha=sha;
  return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p),{method:'PUT',body:JSON.stringify(body)});}
async function putSafe(r,p,text,sha,msg,b){try{return await put(r,p,text,sha,msg,b);}catch(e){if(String(e.message).indexOf('422')<0)throw e;var cur=await readFile(r,p,b);return await put(r,p,text,cur.sha,msg,b);}}
async function serverFiles(r,b){var tree=await readTree(r,b);
  var cand=tree.filter(isServer).slice(0,30), out=[];
  for(var i=0;i<cand.length;i++){try{out.push({path:cand[i],text:(await readFile(r,cand[i],b)).text,sha:(await readFile(r,cand[i],b)).sha});}catch(e){}}
  return out;}

/* ===== فحص سريع ===== */
async function quickCheck(){
  token=$('tok').value.trim(); if(!token){P('الصق التوكن');return;}
  outEl.innerHTML='';logEl.innerHTML='';P('يفحص…');
  try{ var b=$('br').value.trim();
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri], tree=await readTree(r,b);
      for(var i=0;i<tree.filter(isServer).length;i++){
        var p=tree.filter(isServer)[i], t=(await readFile(r,p,b)).text;
        var hasStore=/store\s*:\s*STORE/.test(t), hasDef=/^\s*(const|let|var)\s+STORE\s*=/m.test(t);
        var dup=(t.match(/store\s*:\s*STORE/g)||[]).length, defs=(t.match(/^\s*const\s+STORE\s*=/gm)||[]).length;
        var shebang=/^#!/.test(t), bad = (hasStore&&!hasDef)||defs>1;
        L((bad?'✘ ':'✔ ')+r+'/'+p+' — store:'+dup+' تعريف:'+defs+(shebang?' shebang:نعم':''), bad?'bad':'ok');
      }
    }
    P('انتهى الفحص ✔');
  }catch(e){L('خطأ: '+esc(e.message),'bad');}
}
/* ===== التنفيذ ===== */
var running=false;
async function runAll(){
  if(running)return; token=$('tok').value.trim(); if(!token){P('الصق التوكن');return;}
  running=true;$('bGo').disabled=true;outEl.innerHTML='';logEl.innerHTML='';
  var b=$('br').value.trim(), changed=0;
  try{
    var u=await gh('/user'); L('الاتصال ✔ — '+esc(u.login),'ok');
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri]; P('إصلاح '+r+'…');
      var tree=await readTree(r,b), list=tree.filter(isServer).slice(0,30);
      for(var i=0;i<list.length;i++){
        var f=await readFile(r,list[i],b);
        var res=patchServer(f.text,r);
        if(res.text===f.text){L('↷ '+r+'/'+list[i]+' — لا تغيير','dim');continue;}
        try{ await putSafe(r,list[i],res.text,f.sha,'fix(realtime): '+res.notes.join(' + ')+' ['+r+']',b);
          changed++; L('✔ '+r+'/'+list[i]+' — '+esc(res.notes.join(' | ')),'ok');
        }catch(e){L('✘ '+r+'/'+list[i]+' — '+esc(e.message),'bad');}
        await sleep(160);
      }
    }
    P('انتظر ٤ ثوانٍ…'); await sleep(4000);
    var txt='v18 — معدّل '+changed+' ملف\n';
    for(var ri=0;ri<repos().length;ri++){var r=repos()[ri],tree=await readTree(r,b);
      for(var i=0;i<tree.filter(isServer).length;i++){var p=tree.filter(isServer)[i],t=(await readFile(r,p,b)).text;
        txt+=r+'/'+p+' store:'+(t.match(/store\s*:\s*STORE/g)||[]).length+' تعريف:'+(t.match(/^\s*const\s+STORE\s*=/gm)||[]).length+'\n';}}
    outEl.innerHTML='<div class="done"><b>تم ✔</b> — معدّل '+changed+' ملف<pre style="text-align:left">'+esc(txt)+'</pre></div>'+outEl.innerHTML;
    P('انتهى ✔');
    try{var pp='tools/kdkaw-fix.html',tr=await readTree('kdkaw',b),sh=null;
      if(tr.indexOf(pp)>=0){sh=(await readFile('kdkaw',pp,b)).sha;}
      await putSafe('kdkaw',pp,buildFile(),sh,'chore(tools): v18',b);}catch(e){}
  }catch(e){L('خطأ: '+esc(e.message),'bad');P('توقف');}
  finally{running=false;$('bGo').disabled=false;}
}
function buildFile(){if(!SELF_JS)return document.documentElement.outerHTML;
  return '<!doctype html>\n<html dir="rtl" lang="ar">\n<head>\n<meta charset="utf-8">\n<title>kdkaw fix v18</title>\n<style>\n'+SELF_CSS+'\n</style>\n</head>\n<body style="margin:0;background:#060b14;padding:10px">\n'+SELF_HTML+'\n<script>\n'+SELF_JS+'\n<\/script>\n</body>\n</html>';}
function refresh(){$('ta').value=buildFile();F('الكود جاهز ('+Math.round(buildFile().length/1024)+' KB)');}
$('bSel').onclick=function(){var ta=$('ta');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  F(ok?'✔ نُسخ — افتح رابط التعديل ثم Ctrl+A ثم Ctrl+V ثم Commit':'الكود محدَّد — اضغط Ctrl+C',ok?'ok':'warn');};
try{$('tok').value=localStorage.getItem('kdkaw_tok')||'';}catch(e){}
token=$('tok').value.trim();
$('tok').addEventListener('input',function(e){token=e.target.value.trim();try{localStorage.setItem('kdkaw_tok',token);}catch(x){}});
$('bGo').onclick=runAll; $('bAn').onclick=quickCheck;
$('bTest').onclick=function(){token=$('tok').value.trim();gh('/user').then(function(u){L('الاتصال ✔ — '+esc(u.login),'ok');},function(e){L('فشل: '+esc(e.message),'bad');});};
refresh();
if(topWin&&token){L('ابدأ بـ «🔍 فحص سريع» ثم «إصلاح».','dim');}
})();


</script>
</body>
</html>
