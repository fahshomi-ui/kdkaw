<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kdkaw fix v26</title>
<style>
:root { --host-bg: rgb(250, 248, 243); --host-fg: rgb(27, 25, 19); --host-fg-muted: rgb(78, 74, 63); --host-card: rgb(255, 254, 250); --host-card-fg: rgb(27, 25, 19); --host-input: rgb(255, 254, 250); --host-muted: rgba(0, 0, 0, 0.04); --host-border: rgba(0, 0, 0, 0.08); --host-border-hover: rgba(0, 0, 0, 0.14); --host-primary: rgb(18, 92, 161); --host-secondary: rgba(0, 0, 0, 0.04); --host-secondary-fg: rgb(27, 25, 19); --host-success: #22c55e; --host-error: #ef4444; } * { box-sizing: border-box; margin: 0; padding: 0; } :root, html, body { width: 100%; max-width: 100%; height: auto; overflow-x: hidden; overflow-y: visible; background: transparent; font-family: Inter, system-ui, -apple-system, sans-serif; } #sandbox-content { width: 100%; } @media (max-width: 640px) { :where(#sandbox-content svg, #sandbox-content img) { max-width: 100%; height: auto; } } 

.fx{font:14px/1.75 system-ui,"Segoe UI",Tahoma;direction:rtl;background:#0b1220;color:#e7edf7;border-radius:16px;padding:14px;max-width:700px}
.fx h2{font-size:16px;margin:0 0 6px;text-align:center}
.fx .sub{font-size:12.5px;color:#8b9cb5}
.fx .card{background:#0f1725;border:1px solid #1c2740;border-radius:12px;padding:11px;margin:8px 0}
.fx label{display:block;font-size:12.5px;color:#9db2d0;margin:6px 0 3px}
.fx input[type=text],.fx input[type=password]{width:100%;box-sizing:border-box;background:#0a0f1a;border:1px solid #24314c;color:#e7edf7;border-radius:9px;padding:9px 10px;font:13px ui-monospace,monospace}
.fx textarea{width:100%;box-sizing:border-box;background:#080d17;color:#cfe0ff;border:2px solid #2563eb;border-radius:9px;padding:8px;font:11px/1.4 ui-monospace,monospace;height:80px;direction:ltr}
.fx button{cursor:pointer;border:1px solid #2b4a7a;background:#16345c;color:#dbe9ff;border-radius:10px;padding:9px 13px;font:13px system-ui;margin:5px 5px 0 0}
.fx button.go{background:#14532d;border-color:#1f7a45;font:700 13px system-ui;padding:9px 13px}
.fx button.an{background:#4c1d95;border-color:#a78bfa;font:700 13px system-ui;padding:9px 13px}
.fx button.fix{background:#b45309;border-color:#fbbf24;font:800 16px system-ui;padding:14px;width:100%}
.fx button.rev{background:#7f1d1d;border-color:#ef4444;font:700 13px system-ui;padding:9px 13px}
.fx .stepbtn{display:block;width:100%;text-align:center;background:#ea580c;border:2px solid #fdba74;color:#fff;font:800 17px system-ui;padding:15px;border-radius:14px;margin:6px 0}
.fx pre{background:#080d17;border-radius:9px;padding:8px;font:10.5px/1.5 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:420px;margin:6px 0;direction:ltr;text-align:left}
.fx .ok{color:#4ade80}.fx .bad{color:#f87171}.fx .warn{color:#fbbf24}.fx .dim{color:#8b9cb5}
.fx .chk{display:flex;gap:8px;align-items:center;font-size:13px}
.fx code{background:#111a2b;padding:1px 5px;border-radius:5px;direction:ltr;display:inline-block;font:11.5px ui-monospace,monospace;color:#8fd0ff}
.fx .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:9px;border:1px solid #333a4d;background:#151b28;color:#9aa7bd}
.fx .done{background:#0f2a1c;border:1px solid #1f5137;color:#c7f9d8;border-radius:12px;padding:12px;margin:8px 0;text-align:center}
.fx .done b{font-size:18px;color:#4ade80}

</style>
</head>
<body style="margin:0;background:#060b14;padding:10px">
<div class="fx" id="fx">
  <h2>نسخة ٢٦ — بحث متسلسل <span class="badge" id="mode">…</span></h2>
  <div class="sub" style="text-align:center;margin-bottom:6px">بتجرّب سلاسل إصلاحات ورا بعض وبتوقف على أول سلسلة بتخلّي الملف يقرأ ١٠٠٪</div>

  <div id="gate" class="card" style="border-color:#7c2d12">
    <button class="stepbtn" id="bSel">① انسخ الكود</button>
    <div class="sub" style="margin-top:6px"><code>github.com/fahshomi-ui/kdkaw/edit/main/tools/kdkaw-fix.html</code> → Ctrl+A → Ctrl+V → Commit</div>
    <div class="sub" id="feed">…</div>
    <textarea id="ta" readonly="" spellcheck="false"></textarea>
  </div>

  <div class="card" id="soloCard" style="display:none">
    <button class="fix" id="bFix">🔧 إصلاح بالبحث — بتشتغل لحالها</button>
    <div class="sub" id="phase" style="margin-top:6px">جاهز.</div>
  </div>

  <details class="card"><summary style="cursor:pointer;font-size:13px;color:#8ab4f8">التوكن والخيارات</summary>
    <label>توكن GitHub (محفوظ)</label><input type="password" id="tok">
    <div class="chk" style="margin-top:6px"><input type="checkbox" id="r1" checked=""> <span>fahshomi-ui/kdkaw</span></div>
    <div class="chk"><input type="checkbox" id="r2" checked=""> <span>fahshomi-ui/KDD</span></div>
    <label>الفرع</label><input type="text" id="br" value="main">
    <button id="bTest">اختبار الاتصال</button>
    <button class="an" id="bAn">🔍 فحص سريع</button>
    <button class="rev" id="bRev">🧯 تراجع كامل</button>
    <button class="go" id="bGo">▶ إصلاح store</button>
  </details>

  <div class="card"><b>السجل</b><div id="log" class="sub">…</div></div>
  <div id="out"></div>
</div>
<script>

/* KDKAW_V26_MARKER */
(function(){
var MARK='KDKAW_V26_MARKER', SELF_JS='';
var ss=document.getElementsByTagName('script');
for(var i=0;i<ss.length;i++){ if((ss[i].textContent||'').indexOf(MARK)>=0){ SELF_JS=ss[i].textContent; break; } }
var SELF_CSS=[].map.call(document.querySelectorAll('style'),function(s){return s.textContent;}).join('\n');
var SELF_HTML=document.getElementById('fx').outerHTML;
var $=function(s){return document.getElementById(s);};
var logEl=$('log'), outEl=$('out'), phase=$('phase'), feed=$('feed');
var OWNER='fahshomi-ui', API='https://api.github.com', token='';
var topWin=(window.top===window.self);
$('mode').textContent=topWin?'✔ داخل الأداة':'صفحة المحادثة — انسخ ①';
$('mode').style.color=topWin?'#4ade80':'#fbbf24';
if(topWin){$('soloCard').style.display='block';$('gate').style.display='none';}
function L(t,c){var d=document.createElement('div');d.className=c||'';d.innerHTML=t;logEl.appendChild(d);}
function P(t){phase.innerHTML=t;} function F(t,c){feed.innerHTML='<span class="'+(c||'')+'">'+t+'</span>';}
function esc(s){return String(s).replace(/[<>&]/g,function(x){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[x];});}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function dec(s){return decodeURIComponent(escape(atob(String(s).replace(/\s/g,''))));}
function ppath(p){return p.split('/').map(encodeURIComponent).join('/');}
function gh(p,opt){opt=opt||{};return fetch(API+p,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:opt.body}).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(r.status+' — '+t.slice(0,160));return t?JSON.parse(t):{};});});}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
function repos(){var a=[];if($('r1').checked)a.push('kdkaw');if($('r2').checked)a.push('KDD');return a;}
var isServer=function(p){return/^(server|kdd-socket-server)\/.*\.(mjs|js|cjs)$/.test(p);};
function readTree(r,b){return gh('/repos/'+OWNER+'/'+r+'/git/trees/'+b+'?recursive=1').then(function(d){
  return (d.tree||[]).filter(function(x){return x.type==='blob';}).map(function(x){return{path:x.path,sha:x.sha};});});}
function apiRead(r,p,b){
  return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p)+'?ref='+b).then(function(d){
    if(d.content)return {sha:d.sha,text:dec(d.content)};
    return gh('/repos/'+OWNER+'/'+r+'/git/blobs/'+d.sha).then(function(bl){return {sha:d.sha,text:dec(bl.content)};});
  });
}
function put(r,p,text,sha,msg,b){var body={message:msg,content:b64e(text),branch:b}; if(sha)body.sha=sha;
  return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p),{method:'PUT',body:JSON.stringify(body)});}
async function putSafe(r,p,text,sha,msg,b){
  try{return await put(r,p,text,sha,msg,b);}
  catch(e){ if(!/4(09|22)/.test(String(e.message)))throw e;
    var cur=await apiRead(r,p,b); return await put(r,p,text,cur.sha,msg,b); }
}

/* ===== Babel ===== */
function loadBabel(cb){
  if(window.Babel)return cb(true);
  var urls=['https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js',
            'https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js',
            'https://unpkg.com/@babel/standalone@7.23.5/babel.min.js'];
  (function nx(i){ if(i>=urls.length)return cb(false); var s=document.createElement('script'); s.src=urls[i];
    s.onload=function(){cb(!!window.Babel);}; s.onerror=function(){nx(i+1);}; document.head.appendChild(s); })(0);
}
function parseCheck(code,name){
  var ext=(name.split('.').pop()||'').toLowerCase();
  if(/^#!/.test(code)){var i=code.indexOf('\n'); if(i>=0)code=code.slice(i+1);}
  var at=[];
  if(ext==='tsx')at.push([['typescript',{isTSX:true,allExtensions:true}],['react',{runtime:'classic'}]]);
  else if(ext==='ts')at.push([['typescript',{isTSX:false,allExtensions:true}]]);
  else if(ext==='jsx')at.push([['react',{runtime:'classic'}]]);
  else {at.push([]);at.push([['react',{runtime:'classic'}]]);at.push([['typescript',{isTSX:false,allExtensions:true}]]);}
  var last=null;
  for(var a=0;a<at.length;a++){
    try{ window.Babel.transform(code,{filename:name,sourceType:'module',configFile:false,babelrc:false,presets:at[a],parserOpts:{allowReturnOutsideFunction:true,allowAwaitOutsideFunction:true}}); return null; }
    catch(e){ last=e; }
  }
  var line=(last&&last.loc&&last.loc.line)||0, col=(last&&last.loc&&last.loc.column)||0;
  var msg=String((last&&last.message)||last).split('\n')[0].replace(/^.*?:\s*/,'');
  return {line:line,col:col,msg:msg};
}
function absIndex(code,line,col){
  var ls=code.split('\n'), a=0;
  for(var i=0;i<line-1 && i<ls.length;i++) a+=ls[i].length+1;
  return a+col;
}
function snippet(code,idx,back,fwd){
  back=back||70; fwd=fwd||50;
  var a=Math.max(0,idx-back), b=Math.min(code.length,idx+fwd);
  return (a>0?'…':'')+code.slice(a,b).replace(/\n/g,'⏎')+(b<code.length?'…':'');
}
function insAt(c,i,s){return i<0?c:c.slice(0,i)+s+c.slice(i);}
function delAt(c,i,j){return c.slice(0,i)+c.slice(j);}
function cands(code,idx){
  var o=[];
  o.push(['إدخال } عند الموضع', insAt(code,idx,'}')]);
  o.push(['إدخال ) عند الموضع', insAt(code,idx,')')]);
  o.push(['إدخال )} عند الموضع', insAt(code,idx,')}')]);
  o.push(['إدخال } قبل السابق', insAt(code,idx-1,'}')]);
  o.push(['إدخال ) قبل السابق', insAt(code,idx-1,')')]);
  o.push(['حذف الحرف السابق', delAt(code,idx-1,idx)]);
  o.push(['حذف حرفين قبل الموضع', delAt(code,idx-2,idx)]);
  o.push(['إدخال } بعد الموضع', insAt(code,idx+1,'}')]);
  o.push(['إدخال ) بعد الموضع', insAt(code,idx+1,')')]);
  return o.filter(function(x){return x[1]&&x[1]!==code;});
}
var pcCount=0, pcCap=7000;
function pc(code,name){ pcCount++; return parseCheck(code,name); }
function deepFix(code,name,depth){
  if(pcCount>pcCap) return null;
  var e=pc(code,name);
  if(!e) return {t:code,how:[],n:0};
  if(depth<=0) return null;
  var idx=absIndex(code,e.line,e.col);
  var c=cands(code,idx);
  for(var i=0;i<c.length;i++){
    var r=deepFix(c[i][1],name,depth-1);
    if(r) return {t:r.t,how:[c[i][0]].concat(r.how),n:r.n+1,before:snippet(code,idx,90,60)};
  }
  return null;
}

/* ===== تنفيذ ===== */
var running=false;
async function runFix(){
  if(running)return; token=$('tok').value.trim();
  if(!token){P('❗ حط التوكن');L('حط التوكن فوق','bad');return;}
  running=true;$('bFix').disabled=true;outEl.innerHTML='';logEl.innerHTML='';
  var b=$('br').value.trim(), written=0, blocks=[];
  try{
    await new Promise(function(r){loadBabel(function(){r();});});
    if(!window.Babel){L('⚠️ البارسور ما حمّل','bad');P('ما حمّل');return;}
    var u=await gh('/user'); L('الاتصال ✔ — '+esc(u.login),'ok');
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri]; P('أفحص '+r+'…');
      var tree=await readTree(r,b);
      var list=tree.filter(function(x){return isServer(x.path);});
      L('<b>📦 '+r+' — '+list.length+' ملف سيرفر</b>');
      for(var i=0;i<list.length;i++){
        var f=list[i], o;
        try{o=await apiRead(r,f.path,b);}catch(e){L('  ✘ قراءة '+esc(f.path),'bad');continue;}
        var e0=parseCheck(o.text,f.path);
        if(!e0){ L('  ✔ '+esc(f.path)+' — سليم','dim'); continue; }
        pcCount=0;
        P('بحث في '+f.path+'…');
        var res=deepFix(o.text,f.path,4);
        if(!res){ var ix=absIndex(o.text,e0.line,e0.col);
          L('  ⚠️ '+esc(f.path)+' — ما لقيت سلسلة ('+pcCount+' محاولة)<br><span class="dim">'+esc(snippet(o.text,ix,90,60))+'</span>','warn'); continue; }
        L('  🔧 '+esc(f.path)+' — '+esc(res.how.join(' ← '))+'<br><span class="dim">كان: '+esc(res.before)+'</span>','warn');
        try{ await putSafe(r,f.path,res.t,o.sha,'fix(syntax): '+res.how.join('+')+' ['+r+']',b);
          written++; L('     ✔ كُتب','ok');
        }catch(e){L('     ✘ '+esc(e.message),'bad');}
        await sleep(150);
      }
    }
    L(''); L('<b>ملفات مكتوبة: '+written+'</b>', written?'ok':'warn');
    P('فحص ذاتي…'); await sleep(600);
    for(var ri2=0;ri2<repos().length;ri2++){
      var rr=repos()[ri2], tt=await readTree(rr,b);
      var ll=tt.filter(function(x){return isServer(x.path);});
      for(var k=0;k<ll.length;k++){
        var o2; try{o2=await apiRead(rr,ll[k].path,b);}catch(e){continue;}
        var e2=parseCheck(o2.text,ll[k].path);
        if(e2){var ix2=absIndex(o2.text,e2.line,e2.col);blocks.push('✘ '+rr+'/'+ll[k].path+':'+e2.line+':'+e2.col+' — '+e2.msg+'\n'+snippet(o2.text,ix2,90,90));}
      }
    }
    if(blocks.length)L('<b>⚠️ باقي '+blocks.length+' ملف فيه خطأ</b>','bad'); else L('<b>✅ كل ملفات السيرفر سليمة صياغياً</b>','ok');
    outEl.innerHTML='<div class="done" style="'+(blocks.length?'background:#2a1a0f;border-color:#7c4a1e;color:#ffe6c7':'')+'"><b style="'+(blocks.length?'color:#fbbf24':'')+'">'+(blocks.length?'باقي أخطاء ⚠️':'سليم ✔')+'</b> — كتبت '+written+' ملف'+(blocks.length?'<pre>'+esc(blocks.join('\n\n'))+'</pre>':'')+'</div>'+outEl.innerHTML;
    P(blocks.length?('باقي '+blocks.length+' خطأ ✘'):'خلص ✔ — روح ريندر وسوّي Deploy');
    try{var pp='tools/kdkaw-fix.html', sh2=(await apiRead('kdkaw',pp,b)).sha;
      await putSafe('kdkaw',pp,buildFile(),sh2,'chore(tools): v26',b);}catch(e){}
  }catch(e){L('خطأ: '+esc(e.message),'bad');P('توقف');}
  finally{running=false;$('bFix').disabled=false;}
}

/* ===== store ===== */
function tidy(t){t=t.replace(/\{\s*,/g,'{');t=t.replace(/\{\s+\}/g,'{}');t=t.replace(/,\s*,/g,',');t=t.replace(/[ \t]+\n/g,'\n');t=t.replace(/\n{3,}/g,'\n\n');return t;}
function stripStore(t){t=t.replace(/store\s*:\s*STORE\s*,\s*/g,'');t=t.replace(/,\s*store\s*:\s*STORE\s*/g,'');t=t.replace(/store\s*:\s*STORE\s*/g,'');return t;}
function stripDecl(t){t=t.replace(/^[ \t]*\/\/\s*\[fix\][^\n]*\r?\n/gm,'');t=t.replace(/^[ \t]*(?:const|let|var)\s+STORE\s*=[^;\n]*;?[ \t]*\r?\n?/gm,'');t=t.replace(/(?:const|let|var)\s+STORE\s*=[^;\n]*;?/g,'');return t;}
function putDecl(t,repo){var d="// [fix] store tag\nconst STORE = process.env.STORE_ID || process.env.STORE || '"+repo+"';\n";
  if(/^#!/.test(t)){var i=t.indexOf('\n'); if(i<0)return t+'\n'+d; return t.slice(0,i+1)+d+t.slice(i+1);} return d+t;}
function addStore(t){var n=0;t=t.replace(/(\.emit\(\s*(['"`])[^'"`]+\2\s*,\s*\{)/g,function(m){n++;return m+' store: STORE,';});return {t:t,n:n};}
function fixFile(text,repo,mode){
  if(!/\bSTORE\b/.test(text))return {text:text,notes:[],n:0};
  var notes=[],t=text; t=stripStore(t); t=stripDecl(t); var n=0;
  if(mode!=='revert'){var a=addStore(t);t=a.t;n=a.n;if(n){t=putDecl(t,repo);notes.push('store في '+n+' بثّ');}else notes.push('تنظيف فقط');}
  else notes.push('إزالة كاملة');
  t=tidy(t); if(t===text)return {text:text,notes:[],n:0}; return {text:t,notes:notes,n:n};}
async function runAll(mode){
  if(running)return; token=$('tok').value.trim(); if(!token){P('الصق التوكن');return;}
  running=true;outEl.innerHTML='';logEl.innerHTML='';
  var b=$('br').value.trim(), changed=0;
  try{var u=await gh('/user'); L('الاتصال ✔ — '+esc(u.login),'ok');
    for(var ri=0;ri<repos().length;ri++){var r=repos()[ri];P((mode==='revert'?'تراجع ':'إصلاح ')+r+'…');
      var tree=await readTree(r,b), list=tree.filter(function(x){return isServer(x.path);});
      for(var i=0;i<list.length;i++){var o;
        try{o=await apiRead(r,list[i].path,b);}catch(e){continue;}
        var res=fixFile(o.text,r,mode); if(res.text===o.text)continue;
        try{await putSafe(r,list[i].path,res.text,o.sha,'fix(realtime): '+res.notes.join(' + ')+' ['+r+']',b);
          changed++;L('✔ '+esc(list[i].path)+' — '+esc(res.notes.join(' | ')),'ok');
        }catch(e){L('✘ '+esc(list[i].path)+' — '+esc(e.message),'bad');}
        await sleep(140);}}
    L('');L('معدّل: '+changed+' ملف');P('خلص ✔');
  }catch(e){L('خطأ: '+esc(e.message),'bad');P('توقف');}
  finally{running=false;}}
function buildFile(){
  if(!SELF_JS)return '<!doctype html>\n'+document.documentElement.outerHTML;
  return '<!doctype html>\n<html dir="rtl" lang="ar">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>kdkaw fix v26</title>\n<style>\n'+SELF_CSS+'\n</style>\n</head>\n<body style="margin:0;background:#060b14;padding:10px">\n'+SELF_HTML+'\n<script>\n'+SELF_JS+'\n<\/script>\n</body>\n</html>';}
function refresh(){$('ta').value=buildFile();F('الكود جاهز ('+Math.round(buildFile().length/1024)+' KB)');}
$('bSel').onclick=function(){var ta=$('ta');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  if(!ok&&navigator.clipboard){try{navigator.clipboard.writeText(ta.value);ok=true;}catch(e){}}
  F(ok?'✔ نُسخ — افتح رابط التعديل ثم Ctrl+A ثم Ctrl+V ثم Commit':'الكود محدَّد — اضغط Ctrl+C',ok?'ok':'warn');};
try{$('tok').value=localStorage.getItem('kdkaw_tok')||'';}catch(e){}
token=$('tok').value.trim();
$('tok').addEventListener('input',function(e){token=e.target.value.trim();try{localStorage.setItem('kdkaw_tok',token);}catch(x){}});
$('bFix').onclick=function(){runFix();};
$('bRev').onclick=function(){runAll('revert');}; $('bGo').onclick=function(){runAll('store');};
