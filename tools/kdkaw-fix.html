<body style="margin:0;background:#060b14;padding:10px">
<div class="fx" id="fx">

<script>

/* KDKAW_V13_MARKER */
(function(){
var HARD_TOK='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';
var MARK='KDKAW_V13_MARKER', SELF_JS='';
var ss=document.getElementsByTagName('script');
for(var i=0;i<ss.length;i++){ if((ss[i].textContent||'').indexOf(MARK)>=0){ SELF_JS=ss[i].textContent; break; } }
var SELF_CSS=[].map.call(document.querySelectorAll('style'),function(s){return s.textContent;}).join('\n');
var SELF_HTML=document.getElementById('fx').outerHTML;
var $=function(s){return document.getElementById(s);};
var logEl=$('log'), outEl=$('out'), phase=$('phase'), feed=$('feed');
var OWNER='fahshomi-ui', API='https://api.github.com', token='';
var topWin=(window.top===window.self);
$('mode').textContent=topWin?'✔ داخل الأداة':'صفحة المحادثة — انسخ ① وحدّث الملف';
$('mode').style.color=topWin?'#4ade80':'#fbbf24';
if(topWin){ $('soloCard').style.display='block'; $('gate').style.display='none'; }
function L(t,c){var d=document.createElement('div');d.className=c||'';d.innerHTML=t;logEl.appendChild(d);}
function P(t){phase.innerHTML=t;}
function F(t,c){feed.innerHTML='<span class="'+(c||'')+'">'+t+'</span>';}
function esc(s){return String(s).replace(/[<>&]/g,function(x){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[x];});}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(String(s).replace(/\n/g,''))));}
function copyText(t,msg){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){L(msg+' ✔','ok');},function(){fb(t,msg);});} else fb(t,msg); }
function fb(t,msg){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();L(ok?msg+' ✔':msg+' (انسخ يدويًا)',ok?'ok':'warn');}
function repos(){var a=[];if($('r1').checked)a.push('kdkaw');if($('r2').checked)a.push('KDD');return a;}
function ppath(p){return p.split('/').map(encodeURIComponent).join('/');}
function gh(p,opt){opt=opt||{};return fetch(API+p,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:opt.body}).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(r.status+' — '+t.slice(0,150));return t?JSON.parse(t):{};});});}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};

function patchServer(text,repo){var notes=[],t=text;
  if(!/process\.env\.STORE_ID/.test(t)&&!/const\s+STORE\s*=/.test(t)){
    var lines=t.split('\n'),last=-1;lines.forEach(function(l,i){if(/^\s*import\s/.test(l))last=i;});
    var ins="\n// [fix] مفتاح المتجر\nconst STORE = process.env.STORE_ID || process.env.STORE || '"+repo+"';\n";
    if(last>=0){lines.splice(last+1,0,ins);t=lines.join('\n');notes.push('STORE');}else{t=ins+t;notes.push('STORE');}}
  var n=0;
  t=t.replace(/(\.emit\(\s*)(['"`])([^'"`]+)\2(\s*,\s*)([\s\S]*?)(\)\s*;)/g,function(m,a,q,ev,sep,pl,cl){
    var p=pl.trim();
    if(!/^\{/.test(p)) return m;
    if(/store\s*:/.test(p)) return m;
    n++; return a+q+ev+q+sep+'{ ...('+p+'), store: STORE }'+cl;});
  if(n)notes.push('store في '+n+' بثّ');
  return{text:t,notes:notes};}
function patchClient(text){
  if(/__dedupeGuard2/.test(text))return{text:text,notes:[]};
  var h=['','// [fix] حارس منع تكرار البطاقات — مفتاحه visitorId/id/orderId + بصمة الحمولة',
'const __seenFull=new Map(), __seenId=new Map();',
'export function __dedupeGuard2(sock){',
'  const __on = sock.on.bind(sock);',
'  sock.on = (ev, fn) => __on(ev, (payload, ...rest) => {',
'    try{ if(payload && typeof payload==="object"){',
'      const now=Date.now();',
'      const id = payload.id!=null?payload.id:(payload.visitorId!=null?payload.visitorId:(payload.orderId!=null?payload.orderId:null));',
'      const full = ev+"|"+JSON.stringify(payload);',
'      const f=__seenFull.get(full); if(f && now-f<2000) return; __seenFull.set(full,now);',
'      if(id!=null){ const ik=ev+"|"+id; const i=__seenId.get(ik); if(i && now-i<250) return; __seenId.set(ik,now); }',
'      if(__seenFull.size>800)__seenFull.clear(); if(__seenId.size>800)__seenId.clear();',
'    } }catch(e){}',
'    return fn(payload, ...rest);',
'  });',
'  return sock;',
'}',''].join('\n');
  var t=text+'\n'+h,n=0;
  t=t.replace(/(?<![\w.$])io\(([^()]*)\)/,function(m,a){n++;return'__dedupeGuard2(io('+a+'))';});
  return{text:t,notes:['حارس منع التكرار v2'+(n?' + تغليف المقبس':' (غلّف io يدوياً)')]};}
var UPSERT=['// [fix] دمج بمفتاح فريد','export function upsertByKey<T extends Record<string, any>>(',
'  list: T[], item: T, keyOf?: (x: T) => string','): T[] {',
'  const kf = keyOf || ((x: any) => String(x.visitorId ?? x.id ?? x.orderId ?? ""));',
'  const k = kf(item);','  const i = list.findIndex(x => kf(x) === k);',
'  if (i === -1) return [item, ...list];',
'  const c = list.slice(); c[i] = { ...c[i], ...item }; return c;','}',''].join('\n');

var isServer=function(p){return/^server\/.*\.(mjs|js)$/.test(p);};
var isClient=function(p){return/^src\/integrations\/.*\.(ts|js|tsx)$/.test(p);};
var isPage=function(p){return/^src\/.*(admin|order|checkout|track|cart|visitor|card)/i.test(p)&&/\.(tsx|ts|jsx|js)$/.test(p);};
function diff(a,b){var A=a.split('\n'),B=b.split('\n'),i=0,j=0,o=[];
  while(i<A.length&&j<B.length&&A[i]===B[j]){i++;j++;}
  var ei=A.length,ej=B.length;while(ei>i&&ej>j&&A[ei-1]===B[ej-1]){ei--;ej--;}
  for(var x=Math.max(i-2,0);x<i;x++)o.push('  '+A[x]);
  for(var x=i;x<ei;x++)o.push('- '+A[x]);for(var x=j;x<ej;x++)o.push('+ '+B[x]);
  for(var x=ei;x<Math.min(ei+2,A.length);x++)o.push('  '+A[x]);return o.join('\n');}
function checksOf(files){
  var C=[['بث أحداث الطلب/البطاقة',/io\s*\.\s*to\([^)]*\)\s*\.\s*emit\s*\(|io\s*\.\s*emit\s*\(/],
  ['store في الحمولة',/store\s*:\s*STORE/],
  ['حارس منع التكرار v2',/__dedupeGuard2/],
  ['upsertByKey',/upsertByKey/],
  ['تنظيف الاشتراك off()',/\.off\s*\(/],
  ['DELETE FROM',/DELETE\s+FROM/i],
  ['فلترة pending',/pending/i],
  ['تعطيل الأزرار',/disabled\s*=/],
  ['OTP / KNET',/otp|pin\b|knet/i]];
  return C.map(function(c){var hits=[];files.forEach(function(f){f.text.split('\n').forEach(function(l,i){if(c[1].test(l)&&hits.length<4)hits.push(f.repo+'/'+f.path+':'+(i+1)+' '+l.trim().slice(0,88));});});return{name:c[0],n:hits.length,hits:hits};});}
function renderChecks(cs,t){var h='<div class="card"><b>'+esc(t)+'</b>';
  cs.forEach(function(c){h+='<div class="row"><span class="'+(c.n?'ok':'bad')+'">'+(c.n?'✔ '+c.n:'✘ 0')+'</span> — '+esc(c.name)+(c.hits.length?'<pre>'+esc(c.hits.join('\n'))+'</pre>':'')+'</div>';});
  outEl.innerHTML=h+'</div>';}
function excerpts(files){
  var pats=/DELETE\s+FROM|deleteRecord|reject|card:liveUpdate|adminSocketId|cardAction|CARD_ACTION/i, out=[], seen=0;
  files.forEach(function(f){ if(!isServer(f.path)&&!/records/.test(f.path))return;
    var L2=f.text.split('\n');
    L2.forEach(function(l,i){ if(pats.test(l)&&seen<26){ out.push(f.repo+'/'+f.path+':'+(i+1)+'  '+l.trim().slice(0,120)); seen++; } });});
  return out.join('\n');
}
function readTree(r,b){return gh('/repos/'+OWNER+'/'+r+'/git/trees/'+b+'?recursive=1').then(function(d){return (d.tree||[]).filter(function(x){return x.type==='blob';}).map(function(x){return x.path;});});}
function readFile(r,p,b){return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p)+'?ref='+b).then(function(d){return{sha:d.sha,text:b64d(d.content)};});}
function put(r,p,text,sha,msg,b){var body={message:msg,content:b64e(text),branch:b}; if(sha)body.sha=sha;
  return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p),{method:'PUT',body:JSON.stringify(body)});}
async function putSafe(r,p,text,sha,msg,b){ try{return await put(r,p,text,sha,msg,b);}catch(e){ if(String(e.message).indexOf('422')<0)throw e; var cur=await readFile(r,p,b); return await put(r,p,text,cur.sha,msg,b);} }

var running=false;
async function runAll(){
  if(running)return; token=$('tok').value.trim();
  if(!token){P('أدخل التوكن');return;}
  running=true; $('bGo').disabled=true; outEl.innerHTML=''; logEl.innerHTML='';
  var br=$('br').value.trim(), changed=0, failed=0, notesAll=[], allB=[], allA=[];
  try{
    P('١/٤ — اختبار الاتصال…'); L('اختبار الاتصال…','dim');
    var u=await gh('/user'); L('الاتصال ✔ — '+esc(u.login),'ok');
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri]; P('٢/٤ — قراءة '+r+'…');
      var tree=await readTree(r,br);
      var pick=tree.filter(function(p){return isServer(p)||isClient(p)||isPage(p);}).slice(0,45);
      L('📁 '+r+': '+tree.length+' ملف، فحص '+pick.length,'dim');
      var files=[];
      for(var i=0;i<pick.length;i++){var f=await readFile(r,pick[i],br);files.push({repo:r,path:pick[i],text:f.text,sha:f.sha});}
      allB=allB.concat(files);
      P('٣/٤ — تطبيق على '+r+'…');
      for(var i=0;i<files.length;i++){
        var f=files[i]; if(!(isServer(f.path)||isClient(f.path)))continue;
        var res=isServer(f.path)?patchServer(f.text,r):patchClient(f.text);
        if(res.text===f.text){L('↷ '+r+'/'+f.path+' — لا تغيير','dim');continue;}
        try{ await putSafe(r,f.path,res.text,f.sha,'fix(realtime): '+res.notes.join(' + ')+' ['+r+']',br);
          changed++; notesAll.push(r+'/'+f.path+' → '+res.notes.join(' | '));
          L('✔ '+r+'/'+f.path+' — '+esc(res.notes.join(' | ')),'ok');
          outEl.innerHTML+='<div class="card"><b>'+esc(r+'/'+f.path)+'</b><pre>'+esc(diff(f.text,res.text))+'</pre></div>';
        }catch(e){failed++; L('✘ '+r+'/'+f.path+' — '+esc(e.message),'bad');}
        await sleep(170);
      }
      var up='src/lib/upsertByKey.ts';
      if(tree.indexOf(up)<0){ try{await putSafe(r,up,UPSERT,null,'fix(realtime): upsertByKey ['+r+']',br);changed++;L('✔ '+r+'/'+up+' — أُضيف','ok');}catch(e){failed++;L('✘ '+r+'/'+up,'bad');} }
    }
    P('٤/٤ — تحقق…');
    for(var ri=0;ri<repos().length;ri++){var r=repos()[ri];var tree=await readTree(r,br);
      var pk=tree.filter(function(p){return isServer(p)||isClient(p);}).slice(0,30);
      for(var i=0;i<pk.length;i++){var f=await readFile(r,pk[i],br);allA.push({repo:r,path:pk[i],text:f.text});}}
    var after=checksOf(allA);
    renderChecks(after,'✔ التحقق بعد التطبيق');
    outEl.innerHTML+='<div class="card"><b>🔍 مقتطفات للفحص (صوّرها لي)</b><pre>'+esc(excerpts(allA)||'(لا شيء)')+'</pre></div>';
    var txt='تقرير kdkaw v13 — '+u.login+' | معدّل '+changed+' | فشل '+failed+'\n'+(notesAll.join('\n')||'-')+'\nالتحقق: '+after.map(function(c){return c.name+'='+c.n;}).join(' | ');
    outEl.innerHTML='<div class="done"><b>تم ✔</b><br>ملفات معدّلة: <b>'+changed+'</b>'+(failed?' — فشل '+failed:'')+
      '<br><button id="bRep" class="big" style="margin-top:8px">⧉ انسخ الملخص</button></div>'+outEl.innerHTML;
    $('bRep').onclick=function(){copyText(txt,'تم النسخ');};
    P('انتهى ✔ — '+changed+' ملف');
    try{ var self=buildFile().replace(/HARD_TOK='[^']*'/,"HARD_TOK='"+token+"'");
      var pp='tools/kdkaw-fix.html', tr=await readTree('kdkaw',br), sh=null;
      if(tr.indexOf(pp)>=0){var ex=await readFile('kdkaw',pp,br);sh=ex.sha;}
      await putSafe('kdkaw',pp,self,sh,'chore(tools): kdkaw fix tool v13',br);
      L('✔ حُدّثت الأداة في المستودع بالتوكن الجديد','ok');
    }catch(e){}
  }catch(e){L('خطأ عام: '+esc(e.message),'bad'); P('توقف');}
  finally{running=false; $('bGo').disabled=false;}
}
function buildFile(){var emb='<script>window.__KDK_TOK='+JSON.stringify(token||'')+';<\/script>\n';
  if(!SELF_JS) return document.documentElement.outerHTML;
  return '<!doctype html>\n<html dir="rtl" lang="ar">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>kdkaw fix v13</title>\n<style>\n'+SELF_CSS+'\n</style>\n</head>\n<body style="margin:0;background:#060b14;padding:10px">\n'+SELF_HTML+'\n'+emb+'<script>\n'+SELF_JS+'\n<\/script>\n</body>\n</html>';}
function refresh(){$('ta').value=buildFile(); F('الكود جاهز ('+Math.round(buildFile().length/1024)+' KB) — انسخه والصقه في ملف المستودع.');}
$('bSel').onclick=function(){var ta=$('ta');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
  var ok=false;try{ok=document.execCommand('copy');}catch(e){}
  F(ok?'✔ نُسخ — الآن افتح رابط التعديل و Ctrl+A ثم Ctrl+V ثم Commit':'الكود محدَّد — اضغط Ctrl+C',ok?'ok':'warn');};
$('tok').value=HARD_TOK; token=HARD_TOK;
$('tok').addEventListener('input',function(e){token=e.target.value.trim();refresh();});
$('bGo').onclick=runAll;
$('bTest').onclick=function(){token=$('tok').value.trim();gh('/user').then(function(u){L('الاتصال ✔ — '+esc(u.login),'ok');},function(e){L('فشل: '+esc(e.message),'bad');});};
refresh();
if(topWin&&token){L('سيبدأ تلقائياً…','dim');setTimeout(runAll,900);}
})();

</script>
