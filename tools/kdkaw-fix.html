<body style="margin:0;background:#060b14;padding:10px">
<div class="fx" id="fx">

    <label>توكن GitHub (محفوظ)</label><input type="password" id="tok">
    <div class="chk" style="margin-top:6px"><input type="checkbox" id="r1" checked=""> <span>fahshomi-ui/kdkaw</span></div>
    <div class="chk"><input type="checkbox" id="r2" checked=""> <span>fahshomi-ui/KDD</span></div>

<script>

/* KDKAW_V21_MARKER */
(function(){
var MARK='KDKAW_V21_MARKER', SELF_JS='';
var ss=document.getElementsByTagName('script');
for(var i=0;i<ss.length;i++){ if((ss[i].textContent||'').indexOf(MARK)>=0){ SELF_JS=ss[i].textContent; break; } }
var SELF_CSS=[].map.call(document.querySelectorAll('style'),function(s){return s.textContent;}).join('\n');
var SELF_HTML=document.getElementById('fx').outerHTML;
var $=function(s){return document.getElementById(s);};
var logEl=$('log'), outEl=$('out'), phase=$('phase'), feed=$('feed');
var OWNER='fahshomi-ui', API='https://api.github.com', token='';
var topWin=(window.top===window.self);
$('mode').textContent=topWin?'✔ داخل الأداة':'صفحة المحادثة — انسخ ①';
$('mode').style.color=topWin?'#4ade80':'#fbbf24';
if(topWin){$('soloCard').style.display='block';$('gate').style.display='none';}
function L(t,c){var d=document.createElement('div');d.className=c||'';d.innerHTML=t;logEl.appendChild(d);}
function P(t){phase.innerHTML=t;} function F(t,c){feed.innerHTML='<span class="'+(c||'')+'">'+t+'</span>';}
function esc(s){return String(s).replace(/[<>&]/g,function(x){return{'<':'&lt;','>':'&gt;','&':'&amp;'}[x];});}
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function ppath(p){return p.split('/').map(encodeURIComponent).join('/');}
function gh(p,opt){opt=opt||{};return fetch(API+p,{method:opt.method||'GET',headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:opt.body}).then(function(r){return r.text().then(function(t){if(!r.ok)throw new Error(r.status+' — '+t.slice(0,150));return t?JSON.parse(t):{};});});}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
function repos(){var a=[];if($('r1').checked)a.push('kdkaw');if($('r2').checked)a.push('KDD');return a;}
var isServer=function(p){return/^(server|kdd-socket-server)\/.*\.(mjs|js|cjs)$/.test(p);};
var SRCRE=/\.(js|mjs|cjs|ts|tsx|jsx)$/;
var SKIPRE=/node_modules|\/dist\/|\/build\/|\/\.next\/|coverage/;
function readTree(r,b){return gh('/repos/'+OWNER+'/'+r+'/git/trees/'+b+'?recursive=1').then(function(d){
  return (d.tree||[]).filter(function(x){return x.type==='blob';}).map(function(x){return{path:x.path,sha:x.sha};});});}
function rawRead(r,p,b){return fetch('https://raw.githubusercontent.com/'+OWNER+'/'+r+'/'+b+'/'+ppath(p)+'?t='+Date.now()).then(function(x){if(!x.ok)throw new Error('raw '+x.status);return x.text();});}
function readFile(r,p,b){return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p)+'?ref='+b).then(function(d){return{sha:d.sha,text:decodeURIComponent(escape(atob(String(d.content).replace(/\n/g,''))))};});}
function put(r,p,text,sha,msg,b){var body={message:msg,content:b64e(text),branch:b}; if(sha)body.sha=sha;
  return gh('/repos/'+OWNER+'/'+r+'/contents/'+ppath(p),{method:'PUT',body:JSON.stringify(body)});}
async function putSafe(r,p,text,sha,msg,b){try{return await put(r,p,text,sha,msg,b);}catch(e){if(String(e.message).indexOf('422')<0)throw e;var cur=await readFile(r,p,b);return await put(r,p,text,cur.sha,msg,b);}}
function pool(items,n,fn){var i=0,out=new Array(items.length);
 function w(){if(i>=items.length)return Promise.resolve();var k=i++;return Promise.resolve(fn(items[k],k)).then(function(v){out[k]=v;},function(){out[k]=null;}).then(w);}
 var a=[],j;for(j=0;j<Math.max(1,Math.min(n,items.length));j++)a.push(w());
 return Promise.all(a).then(function(){return out;});}

/* ===== Babel ===== */
function loadBabel(cb){
  if(window.Babel)return cb(true);
  var urls=['https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js',
            'https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js',
            'https://unpkg.com/@babel/standalone@7.23.5/babel.min.js'];
  (function nx(i){ if(i>=urls.length)return cb(false); var s=document.createElement('script'); s.src=urls[i];
    s.onload=function(){cb(!!window.Babel);}; s.onerror=function(){nx(i+1);}; document.head.appendChild(s); })(0);
}
function ctx(code,line){
  var ls=code.split('\n'), a=Math.max(0,line-3), b=Math.min(ls.length,line+2), o=[];
  for(var i=a;i<b;i++)o.push((i+1)+(i+1===line?' >> ':'    ')+ls[i]);
  return o.join('\n');
}
function parseCheck(code,name){
  var ext=(name.split('.').pop()||'').toLowerCase();
  if(/^#!/.test(code)){var i=code.indexOf('\n'); if(i>=0)code=code.slice(i+1);}
  var at=[];
  if(ext==='tsx')at.push([['typescript',{isTSX:true,allExtensions:true}],['react',{runtime:'classic'}]]);
  else if(ext==='ts')at.push([['typescript',{isTSX:false,allExtensions:true}]]);
  else if(ext==='jsx')at.push([['react',{runtime:'classic'}]]);
  else {at.push([]);at.push([['react',{runtime:'classic'}]]);at.push([['typescript',{isTSX:false,allExtensions:true}]]);}
  var last=null;
  for(var a=0;a<at.length;a++){
    try{ window.Babel.transform(code,{filename:name,sourceType:'module',configFile:false,babelrc:false,presets:at[a],parserOpts:{allowReturnOutsideFunction:true,allowAwaitOutsideFunction:true}}); return null; }
    catch(e){ last=e; }
  }
  var line=(last&&last.loc&&last.loc.line)||0;
  var msg=String((last&&last.message)||last).split('\n')[0].replace(/^.*?:\s*/,'');
  return {line:line,msg:msg,code:code};
}
async function scanSyntax(){
  if(!token){P('الصق التوكن');return;}
  P('تحميل الفاحص…'); outEl.innerHTML='';logEl.innerHTML='';
  await new Promise(function(r){loadBabel(function(){r();});});
  if(!window.Babel){L('⚠️ تعذّر تحميل الفاحص','bad');P('الفاحص ما حمّل');return;}
  P('يفحص الصياغة…');
  var b=$('br').value.trim(), bad=0, tot=0, blocks=[];
  try{
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri], tree=await readTree(r,b);
      var list=tree.filter(function(x){return SRCRE.test(x.path)&&!SKIPRE.test(x.path);});
      L('<b>📦 '+r+' — '+list.length+' ملف</b>');
      var res=await pool(list,12,function(f){return rawRead(r,f.path,b).then(function(t){return {p:f.path,t:t};},function(){return null;});});
      var cnt=0;
      for(var i=0;i<res.length;i++){
        var it=res[i]; if(!it)continue; tot++;
        var e=parseCheck(it.t,it.p);
        if(e){bad++;cnt++;blocks.push('✘ '+r+'/'+it.p+':'+e.line+' — '+e.msg+'\n'+ctx(it.t,e.line));}
      }
      L('• أخطاء في '+r+': '+cnt,cnt?'bad':'ok');
    }
    L('');
    if(bad){ L('<b>⚠️ '+bad+' ملف فيه خطأ صياغة من '+tot+'</b>','warn');
      outEl.innerHTML='<div class="done" style="background:#2a1a0f;border-color:#7c4a1e;color:#ffe6c7"><b style="color:#fbbf24">أخطاء الصياغة</b><pre>'+esc(blocks.join('\n\n'))+'</pre></div>'+outEl.innerHTML;
    } else L('<b>✅ كل الملفات سليمة صياغياً ('+tot+' ملف)</b>','ok');
    P(bad?('لقيت '+bad+' ملف فيه خطأ ✘'):'نظيف ✔');
  }catch(e){L('خطأ: '+esc(e.message),'bad');P('توقف');}
}

/* ===== محرك ===== */
function tidy(t){
  t=t.replace(/\{\s*,/g,'{');
  t=t.replace(/\{\s+\}/g,'{}');
  t=t.replace(/,\s*,/g,',');
  t=t.replace(/[ \t]+\n/g,'\n');
  t=t.replace(/\n{3,}/g,'\n\n');
  return t;
}
function stripStore(t){
  t=t.replace(/store\s*:\s*STORE\s*,\s*/g,'');
  t=t.replace(/,\s*store\s*:\s*STORE\s*/g,'');
  t=t.replace(/store\s*:\s*STORE\s*/g,'');
  return t;
}
function stripDecl(t){
  t=t.replace(/^[ \t]*\/\/\s*\[fix\][^\n]*\r?\n/gm,'');
  t=t.replace(/^[ \t]*(?:const|let|var)\s+STORE\s*=[^;\n]*;?[ \t]*\r?\n?/gm,'');
  t=t.replace(/(?:const|let|var)\s+STORE\s*=[^;\n]*;?/g,'');
  return t;
}
function putDecl(t,repo){
  var decl="// [fix] store tag\nconst STORE = process.env.STORE_ID || process.env.STORE || '"+repo+"';\n";
  if(/^#!/.test(t)){var i=t.indexOf('\n'); if(i<0)return t+'\n'+decl; return t.slice(0,i+1)+decl+t.slice(i+1);}
  return decl+t;
}
function addStore(t){var n=0;
  t=t.replace(/(\.emit\(\s*(['"`])[^'"`]+\2\s*,\s*\{)/g,function(m){n++;return m+' store: STORE,';});
  return {t:t,n:n};}
function fixFile(text,repo,mode){
  if(!/\bSTORE\b/.test(text))return {text:text,notes:[],n:0};
  var notes=[],t=text;
  t=stripStore(t); t=stripDecl(t);
  var n=0;
  if(mode!=='revert'){
    var a=addStore(t); t=a.t; n=a.n;
    if(n){ t=putDecl(t,repo); notes.push('store في '+n+' بثّ'); notes.push('تعريف واحد'); }
    else notes.push('تنظيف فقط');
  } else notes.push('إزالة كاملة');
  t=tidy(t);
  if(t===text)return {text:text,notes:[],n:0};
  return {text:t,notes:notes,n:n};
}
async function quickCheck(){
  token=$('tok').value.trim(); if(!token){P('الصق التوكن');return;}
  outEl.innerHTML='';logEl.innerHTML='';P('يفحص…');
  try{
    var b=$('br').value.trim(), bad=0, tot=0;
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri], tree=await readTree(r,b);
      var list=tree.filter(function(x){return isServer(x.path);});
      L('<b>'+r+' — '+list.length+' ملف سيرفر</b>');
      for(var i=0;i<list.length;i++){
        var t; try{t=await rawRead(r,list[i].path,b);}catch(e){continue;}
        tot++;
        var st=(t.match(/store\s*:\s*STORE/g)||[]).length;
        var de=(t.match(/^[ \t]*(?:const|let|var)\s+STORE\s*=/gm)||[]).length;
        var problem=(st>0&&de!==1)||de>1;
        if(problem)bad++;
        if(st||de||problem)L((problem?'✘ ':'✔ ')+esc(list[i].path)+' — store:'+st+' تعريف:'+de,problem?'bad':'ok');
      }
    }
    L(''); L(bad?('<b>⚠️ '+bad+' ملف فيه مشكلة</b>'):('<b>✅ نظيف — '+tot+' ملف</b>'),bad?'warn':'ok');
    P('انتهى الفحص ✔');
  }catch(e){L('خطأ: '+esc(e.message),'bad');}
}
var running=false;
async function runAll(mode){
  if(running)return; token=$('tok').value.trim(); if(!token){P('الصق التوكن');return;}
  running=true;$('bGo').disabled=true;$('bRev').disabled=true;outEl.innerHTML='';logEl.innerHTML='';
  var b=$('br').value.trim(), changed=0, emits=0, written=[];
  try{
    var u=await gh('/user'); L('الاتصال ✔ — '+esc(u.login),'ok');
    for(var ri=0;ri<repos().length;ri++){
      var r=repos()[ri]; P((mode==='revert'?'تراجع ':'إصلاح ')+r+'…');
      var tree=await readTree(r,b);
      var list=tree.filter(function(x){return isServer(x.path);});
      L('<b>• '+r+': '+list.length+' ملف سيرفر</b>');
      for(var i=0;i<list.length;i++){
        var f=list[i], txt;
        try{txt=await rawRead(r,f.path,b);}catch(e){L('✘ قراءة '+esc(f.path),'bad');continue;}
        var res=fixFile(txt,r,mode);
        if(res.text===txt){continue;}
        try{ await putSafe(r,f.path,res.text,f.sha,'fix(realtime): '+res.notes.join(' + ')+' ['+r+']',b);
          changed++; emits+=res.n; written.push({r:r,p:f.path,t:res.text}); L('✔ '+esc(f.path)+' — '+esc(res.notes.join(' | ')),'ok');
        }catch(e){L('✘ '+esc(f.path)+' — '+esc(e.message),'bad');}
        await sleep(140);
      }
    }
    P('فحص ذاتي للملفات المعدّلة…');
    await new Promise(function(res){loadBabel(function(){res();});});
    var broken=[];
    if(window.Babel){
      for(var w=0;w<written.length;w++){
        var e2=parseCheck(written[w].t,written[w].p);
        if(e2)broken.push('✘ '+written[w].r+'/'+written[w].p+':'+e2.line+' — '+e2.msg+'\n'+ctx(written[w].t,e2.line));
      }
      if(broken.length)L('<b>⚠️ '+broken.length+' ملف طلع فيه خطأ صياغة بعد التعديل!</b>','bad');
      else if(written.length)L('✅ كل الملفات المعدّلة سليمة صياغياً','ok');
    }
    var txt='v21 — معدّل '+changed+' ملف / '+emits+' بثّ\n';
    if(broken.length)txt+='\n== أخطاء ==\n'+broken.join('\n\n')+'\n';
    for(var ri2=0;ri2<repos().length;ri2++){
      var rr=repos()[ri2], tt=await readTree(rr,b);
      var ll=tt.filter(function(x){return isServer(x.path);});
      for(var k=0;k<ll.length;k++){var c;try{c=await rawRead(rr,ll[k].path,b);}catch(e){continue;}
        var s=(c.match(/store\s*:\s*STORE/g)||[]).length, d=(c.match(/^[ \t]*(?:const|let|var)\s+STORE\s*=/gm)||[]).length;
        if(s||d)txt+=rr+'/'+ll[k].path+'  store:'+s+'  تعريف:'+d+'\n';}
    }
    outEl.innerHTML='<div class="done" style="'+(broken.length?'background:#2a1a0f;border-color:#7c4a1e;color:#ffe6c7':'')+'"><b style="'+(broken.length?'color:#fbbf24':'')+'">'+(broken.length?'فيه أخطاء ⚠️':'تم ✔')+'</b> — معدّل '+changed+' ملف، '+emits+' بثّ<pre>'+esc(txt)+'</pre></div>'+outEl.innerHTML;
    P(broken.length?('خلص بس فيه '+broken.length+' خطأ ✘'):'انتهى ✔');
    try{var pp='tools/kdkaw-fix.html', sh2=(await readFile('kdkaw',pp,b)).sha;
      await putSafe('kdkaw',pp,buildFile(),sh2,'chore(tools): v21',b);}catch(e){}
  }catch(e){L('خطأ: '+esc(e.message),'bad');P('توقف');}
  finally{running=false;$('bGo').disabled=false;$('bRev').disabled=false;}
}
function buildFile(){
  if(!SELF_JS)return '<!doctype html>\n'+document.documentElement.outerHTML;
  return '<!doctype html>\n<html dir="rtl" lang="ar">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>kdkaw fix v21</title>\n<style>\n'+SELF_CSS+'\n</style>\n</head>\n<body style="margin:0;background:#060b14;padding:10px">\n'+SELF_HTML+'\n<script>\n'+SELF_JS+'\n<\/script>\n</body>\n</html>';}
function refresh(){$('ta').value=buildFile();F('الكود جاهز ('+Math.round(buildFile().length/1024)+' KB)');}
$('bSel').onclick=function(){var ta=$('ta');ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
