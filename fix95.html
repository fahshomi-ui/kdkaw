<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>fix95</title>
<style>
body{font:13px/1.6 system-ui,sans-serif;background:#0f1115;color:#e7e9ee;padding:16px;max-width:820px;margin:auto}
input{font:13px monospace;padding:9px;width:100%;box-sizing:border-box;background:#181c22;color:#e7e9ee;border:1px solid #2b313a;border-radius:8px}
button{font:14px system-ui;padding:10px 18px;margin-top:10px;background:#2563eb;color:#fff;border:0;border-radius:8px;cursor:pointer}
pre{background:#14181e;border:1px solid #232a33;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;min-height:120px}
.ok{color:#7ee787}.er{color:#ff7b72}.wn{color:#f0b429}
</style></head><body>
<h3>FIX95 — تعديل server/index.js تلقائياً</h3>
<p>الصق التوكن (ghp_...) واضغط تنفيذ. لا تنسخ التوكن لأي ملف — لهيك ما بينحذف.</p>
<input id="t" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
<button id="go">تنفيذ التعديل</button>
<pre id="o"></pre>
<script>
var O=document.getElementById('o');
function L(t,c){var d=document.createElement('div');if(c)d.className=c;d.textContent=String(t);O.appendChild(d);}
var REPO='fahshomi-ui/KDD', BR='main', PATH='server/index.js';
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}
var F1=[
'      existingVisitor = savedVisitors.find(v => v._id === existingVisitorId);',
'      console.log(`Looking for existing visitor with ID: ${existingVisitorId}, found: ${!!existingVisitor}`);',
'    }'
].join('\n');
var R1=F1+'\n'+
'    if (!existingVisitor && visitorInfo.ip) {\n'+
'      try {\n'+
'        var __best = null;\n'+
'        savedVisitors.forEach(function (v) {\n'+
'          if (!v || v.ip !== visitorInfo.ip) return;\n'+
'          if (Date.now() - (v.lastActivity || 0) > 1800000) return;\n'+
'          if (!__best || (v.lastActivity || 0) > (__best.lastActivity || 0)) __best = v;\n'+
'        });\n'+
'        existingVisitor = __best;\n'+
'        if (existingVisitor) console.log("[FIX95] adopted existing visitor by IP: " + existingVisitor._id);\n'+
'      } catch (e) {}\n'+
'    }';
var F2='a.sort(function(x,y){return ((y.v.fullName?1:0)-(x.v.fullName?1:0))||((x.v.sessionStartTime||0)-(y.v.sessionStartTime||0))});';
var R2='a.sort(function(x,y){return ((y.v.isConnected?1:0)-(x.v.isConnected?1:0))||((y.v.lastActivity||0)-(x.v.lastActivity||0))||((y.v.fullName?1:0)-(x.v.fullName?1:0))});';
function H(tk){return {Authorization:'token '+tk, Accept:'application/vnd.github+json'}}
document.getElementById('go').onclick=async function(){
  O.innerHTML='';
  var tk=document.getElementById('t').value.trim();
  if(!tk){L('الصق التوكن أولاً','er');return;}
  try{
    L('0) فحص التوكن…');
    var u=await fetch('https://api.github.com/user',{headers:H(tk),cache:'no-store'});
    if(u.status===401){L('401 — التوكن مرفوض. أنشئ واحد جديد (classic + scope repo) ولا تلصقه بأي ملف.','er');return;}
    var uj=await u.json(); L('مسجّل: '+uj.login,'ok');
    L('1) قراءة الملف…');
    var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+PATH+'?ref='+BR+'&t='+Date.now(),{headers:H(tk),cache:'no-store'});
    if(!r.ok){L('فشل القراءة HTTP '+r.status,'er');L(await r.text());return;}
    var j=await r.json();
    var src=b64d(j.content);
    L('حجم الملف: '+src.length+' حرف — sha: '+j.sha.slice(0,7),'ok');
    var did=false;
    if(src.indexOf(F1)>-1){src=src.replace(F1,R1);L('✔ التعديل 1: منع تكرار السجل بالـ IP','ok');did=true;}
    else if(src.indexOf('[FIX95]')>-1){L('• التعديل 1 مطبّق مسبقاً','wn');}
    else{L('✘ التعديل 1 — النص الأصلي غير موجود','er');}
    if(src.indexOf(F2)>-1){src=src.replace(F2,R2);L('✔ التعديل 2: الدمج يحتفظ بالبطاقة الحيّة','ok');did=true;}
    else if(src.indexOf('isConnected?1:0')>-1){L('• التعديل 2 مطبّق مسبقاً','wn');}
    else{L('✘ التعديل 2 — السطر الأصلي غير موجود','er');}
    if(!did){L('ما في شي جديد — خلص','wn');return;}
    L('2) الحفظ (commit)…');
    var p=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+PATH,{method:'PUT',headers:Object.assign(H(tk),{'Content-Type':'application/json'}),body:JSON.stringify({message:'fix(server): adopt visitor by IP + keep live record on merge [FIX95]',content:b64e(src),sha:j.sha,branch:BR})});
    if(!p.ok){L('فشل الحفظ HTTP '+p.status,'er');L(await p.text());return;}
    var pj=await p.json();
    L('تم ✔ commit: '+pj.commit.sha.slice(0,7),'ok');
    L('روح Render واضغط Deploy (أو بينشر لحاله).','ok');
  }catch(e){L('خطأ: '+e.message,'er');}
};
</script></body></html>
